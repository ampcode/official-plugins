name: Mirror to Pierre

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-pierre
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push main to the official plugin distribution repository
        env:
          AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
        run: |
          test -n "$AMP_API_KEY"
          git config --global credential.helper store
          printf 'protocol=https\nhost=ampcode.com\nusername=amp\npassword=%s\n\n' \
            "$AMP_API_KEY" | git credential approve
          git remote add pierre https://ampcode.com/git/-/official-plugins
          git push pierre HEAD:main
