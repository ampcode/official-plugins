name: Mirror to Pierre

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-pierre
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push main to the official plugin distribution repository
        env:
          AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
        run: |
          test -n "$AMP_API_KEY"
          basic_auth="$(printf 'amp:%s' "$AMP_API_KEY" | base64 -w0)"
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          printf '[http "https://ampcode.com/"]\n\textraHeader = Authorization: Basic %s\n' \
            "$basic_auth" > "$GIT_CONFIG_GLOBAL"
          unset basic_auth AMP_API_KEY
          git remote add pierre https://ampcode.com/git/-/official-plugins
          git push pierre HEAD:main
