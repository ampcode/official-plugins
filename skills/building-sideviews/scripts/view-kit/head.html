<meta data-amp-view charset="utf-8"><meta data-amp-view name="viewport" content="width=device-width,initial-scale=1"><style data-amp-view>:root{__THEME_ROOT__;--background:var(--color-background-primary);--foreground:var(--color-text-primary);--muted-foreground:var(--color-text-secondary);--card:var(--color-background-secondary);--muted:var(--color-background-tertiary);--border:var(--color-border-primary);--link:var(--color-text-info);--success:var(--color-text-success);--warning:var(--color-text-warning);--destructive:var(--color-text-danger);--grid:color-mix(in oklab, var(--foreground) 8%, transparent);--chart-context:color-mix(in oklab, var(--muted-foreground) 65%, var(--background));--chart-1:light-dark(#1a609e,#5b9ddf);--chart-2:light-dark(#b36d2a,#f6ab6b);--chart-3:light-dark(#0e9a94,#47d6cf);--chart-4:light-dark(#913c5b,#d47795);--chart-5:light-dark(#71640b,#b0a03c);--chart-6:light-dark(#7377c6,#b1b7fd);--series-1:#12a88a;--series-2:#e36f4a;--series-3:#3d82e8;--series-4:#9b5de5;--series-5:#eab308;--series-6:#ef476f;--series-7:#00b8d9;--series-8:#f77f00;--series-9:#7cb342;--series-10:#94a3b8;--radius:8px;padding-inline:8px}::highlight(amp-find){background-color:light-dark(#ffff0054,#00ffff8a)}::highlight(amp-find-selected){background-color:light-dark(#ff6a0054,#ff00ff8a)}/* Amp view kit: Amp's own components as plain classes, so views look like the product. */
*,
*::before,
*::after {
	box-sizing: border-box;
}
html {
	background: var(--background);
	color: var(--foreground);
	font-family: var(--font-sans);
	font-size: 13px;
	line-height: 20px;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	-webkit-text-size-adjust: 100%;
	text-rendering: optimizeLegibility;
}
/* The system font's stylistic sets the web app turns on for macOS and iOS (ss07 one-storey a, ss06
   high legibility); kit.js marks the platform. Set on every element because a view's own `font`
   shorthand resets the property, and without specificity so a view's own value still wins. */
:where(html[data-amp-platform='darwin']),
:where(html[data-amp-platform='darwin']) * {
	font-feature-settings:
		'ss07' 1,
		'ss06' 1;
}
body {
	margin: 0;
}
h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
	margin: 0;
}
button,
input,
select,
textarea {
	font: inherit;
	color: inherit;
}
code,
kbd,
.ui-mono {
	font-family: var(--font-mono);
	font-size: 12px;
}
::selection {
	background: color-mix(in oklab, var(--link) 30%, transparent);
}

/* Text */
.ui-title {
	font-size: 13px;
	line-height: 20px;
	font-weight: 500;
	text-wrap: balance;
}
.ui-sub {
	margin-top: 2px;
	font-size: 12px;
	line-height: 18px;
	color: var(--muted-foreground);
	text-wrap: pretty;
}
.ui-label {
	font-size: 12px;
	line-height: 18px;
	color: var(--muted-foreground);
}
.ui-caption {
	font-size: 11px;
	line-height: 16px;
	color: var(--muted-foreground);
}
.ui-muted {
	color: var(--muted-foreground);
}
.ui-num {
	font-variant-numeric: tabular-nums;
}
.ui-big {
	font-size: 20px;
	line-height: 24px;
	font-weight: 500;
	letter-spacing: -0.01em;
	font-variant-numeric: tabular-nums;
}
.ui-header {
	display: grid;
	gap: 0;
	margin-bottom: 16px;
}
.ui-stack {
	display: grid;
	gap: var(--gap, 12px);
}
.ui-stack > :empty {
	display: none;
}
.ui-row {
	display: flex;
	align-items: center;
	gap: var(--gap, 8px);
}
.ui-rule {
	height: 1px;
	background: var(--border);
	border: 0;
	margin: 16px 0;
}

/* Icons: <i data-icon="check"></i> or ui.icon('check') */
.ui-icon {
	width: 16px;
	height: 16px;
	flex: none;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.75;
	stroke-linecap: round;
	stroke-linejoin: round;
	vertical-align: -3px;
}
.ui-icon.sm {
	width: 14px;
	height: 14px;
	vertical-align: -2px;
}
.ui-icon.xs {
	width: 12px;
	height: 12px;
	vertical-align: -1px;
}
.ui-spin {
	animation: ui-spin 1s linear infinite;
}

/* Buttons, after Amp's Button */
.ui-btn {
	position: relative;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 4px;
	height: 28px;
	padding: 0 10px;
	border: 1px solid transparent;
	border-radius: 6px;
	background: transparent;
	color: color-mix(in oklab, var(--foreground) 80%, transparent);
	font-size: 13px;
	font-weight: 500;
	white-space: nowrap;
	cursor: pointer;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
	transition: transform 120ms ease-out;
}
.ui-btn .ui-icon {
	width: 16px;
	height: 16px;
	vertical-align: 0;
}
.ui-btn.primary {
	background: color-mix(in srgb, var(--background) 5%, var(--foreground));
	color: var(--background);
}
.ui-btn.outline {
	border-color: var(--border);
	color: var(--foreground);
}
.ui-btn.danger {
	color: var(--destructive);
}
.ui-btn.sm {
	height: 24px;
	padding: 0 8px;
	font-size: 12px;
}
.ui-btn.sm .ui-icon {
	width: 14px;
	height: 14px;
}
.ui-btn.icon {
	width: 28px;
	padding: 0;
}
.ui-btn.icon.sm {
	width: 24px;
}
.ui-btn.circle {
	border-radius: 999px;
}
.ui-btn:disabled {
	opacity: 0.5;
	pointer-events: none;
}
.ui-btn:active {
	transform: scale(0.97);
}
@media (hover: hover) and (pointer: fine) {
	.ui-btn:hover {
		background: color-mix(in oklab, var(--foreground) 5%, transparent);
		color: var(--foreground);
	}
	.ui-btn.primary:hover {
		background: color-mix(in srgb, var(--background) 15%, var(--foreground));
		color: var(--background);
	}
}
:where(.ui-btn, .ui-seg button, .ui-tab, [tabindex]):focus-visible {
	outline: 2px solid var(--link);
	outline-offset: 1px;
}

/* Segmented control. The kit animates a sliding thumb behind the selected item. */
.ui-seg {
	position: relative;
	display: inline-flex;
	gap: 2px;
	padding: 2px;
	border-radius: 8px;
	background: var(--muted);
	isolation: isolate;
}
.ui-seg button {
	position: relative;
	z-index: 1;
	height: 24px;
	padding: 0 10px;
	border: 0;
	border-radius: 6px;
	background: none;
	color: var(--muted-foreground);
	font-size: 12px;
	font-weight: 500;
	cursor: pointer;
	white-space: nowrap;
}
.ui-seg button[aria-selected='true'] {
	color: var(--foreground);
}
.ui-seg .ui-seg-thumb {
	position: absolute;
	z-index: 0;
	top: 2px;
	left: 0;
	height: 24px;
	border-radius: 6px;
	background: var(--background);
	box-shadow:
		0 0 0 1px var(--border),
		0 1px 2px rgb(0 0 0 / 0.06);
	transition:
		transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
		width 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
@media (hover: hover) and (pointer: fine) {
	.ui-seg button:not([aria-selected='true']):hover {
		color: var(--foreground);
	}
}

/* Surfaces: only for things that stand for real objects (a window, a menu, a panel) */
.ui-surface {
	border-radius: 10px;
	background: var(--card);
	box-shadow: inset 0 0 0 1px var(--border);
}
.ui-pane {
	border-radius: 10px;
	background: var(--background);
	box-shadow: inset 0 0 0 1px var(--border);
	overflow: hidden;
}
.ui-pane-header {
	display: flex;
	align-items: center;
	gap: 8px;
	height: 36px;
	padding: 0 12px;
	border-bottom: 1px solid var(--border);
	color: var(--muted-foreground);
	font-size: 12px;
}
.ui-pane-body {
	padding: 16px;
}
.ui-float {
	border-radius: 10px;
	background: var(--background);
	box-shadow:
		0 0 0 1px var(--border),
		0 8px 24px -8px rgb(0 0 0 / 0.18),
		0 2px 6px -2px rgb(0 0 0 / 0.08);
}

/* Small marks */
.ui-chip {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	height: 20px;
	padding: 0 6px;
	border-radius: 5px;
	box-shadow: inset 0 0 0 1px var(--border);
	color: var(--muted-foreground);
	font-size: 12px;
	white-space: nowrap;
}
.ui-kbd {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-width: 18px;
	height: 18px;
	padding: 0 4px;
	border-radius: 4px;
	box-shadow:
		inset 0 0 0 1px var(--border),
		inset 0 -1px 0 var(--border);
	color: var(--muted-foreground);
	font-family: var(--font-sans);
	font-size: 11px;
}
.ui-dot {
	display: inline-block;
	width: 6px;
	height: 6px;
	flex: none;
	border-radius: 50%;
	background: var(--muted-foreground);
}
.ui-status {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	color: var(--muted-foreground);
	font-size: 12px;
}
[data-tone='success'] {
	--tone: var(--success);
}
[data-tone='warning'] {
	--tone: var(--warning);
}
[data-tone='danger'] {
	--tone: var(--destructive);
}
[data-tone='info'] {
	--tone: var(--link);
}
[data-tone] .ui-dot,
.ui-dot[data-tone] {
	background: var(--tone);
}
.ui-delta[data-tone] {
	color: var(--tone);
	font-variant-numeric: tabular-nums;
}
.ui-avatar {
	display: inline-grid;
	place-items: center;
	width: 20px;
	height: 20px;
	border-radius: 50%;
	background: var(--muted);
	color: var(--muted-foreground);
	font-size: 10px;
	font-weight: 500;
}

/* Amp transcript pieces, for mockups of Amp */
.ui-user-msg {
	justify-self: end;
	max-width: 80%;
	padding: 6px 12px;
	border-radius: 12px;
	background: color-mix(in oklab, var(--success) 9%, var(--background));
	box-shadow: 0 0 0 1px color-mix(in oklab, var(--success) 14%, transparent);
}
.ui-tool-row {
	display: flex;
	align-items: center;
	gap: 8px;
	color: var(--muted-foreground);
}
.ui-tool-row .ui-icon {
	width: 16px;
	height: 16px;
}
.ui-tool-row code {
	color: var(--foreground);
}
.ui-composer {
	display: grid;
	gap: 8px;
	padding: 10px 10px 8px 12px;
	border-radius: 14px;
	background: var(--background);
	box-shadow:
		0 0 0 1px var(--border),
		0 1px 2px rgb(0 0 0 / 0.04);
}
.ui-composer-input {
	min-height: 20px;
	color: var(--muted-foreground);
}
.ui-caret {
	display: inline-block;
	width: 1.5px;
	height: 16px;
	margin-right: 1px;
	vertical-align: -3px;
	background: var(--foreground);
	animation: ui-blink 1.1s step-end infinite;
}
@keyframes ui-blink {
	50% {
		opacity: 0;
	}
}
.ui-composer-footer {
	display: flex;
	align-items: center;
	gap: 4px;
	color: var(--muted-foreground);
}
.ui-composer-footer .ui-spacer {
	flex: 1;
}
.ui-send {
	display: inline-grid;
	place-items: center;
	width: 26px;
	height: 26px;
	border-radius: 50%;
	border: 0;
	background: var(--foreground);
	color: var(--background);
}
.ui-send .ui-icon {
	width: 14px;
	height: 14px;
	stroke-width: 2;
}

/* Menus */
.ui-menu {
	display: grid;
	min-width: 200px;
	padding: 4px;
}
.ui-menu-item {
	display: flex;
	align-items: center;
	gap: 8px;
	height: 28px;
	padding: 0 8px;
	border-radius: 6px;
	cursor: default;
}
.ui-menu-item .ui-hint {
	margin-left: auto;
	color: var(--muted-foreground);
	font-size: 12px;
}
.ui-menu-sep {
	height: 1px;
	margin: 4px -4px;
	background: var(--border);
}
@media (hover: hover) and (pointer: fine) {
	.ui-menu-item:hover {
		background: var(--muted);
	}
}

/* Tables */
.ui-table {
	width: 100%;
	border-collapse: collapse;
	font-variant-numeric: tabular-nums;
}
/* Cells take no specificity from `.ui-table`, so a view's own `th` and `td` rules win, such as a
   phone layout that stacks each row's cells as blocks. Padding, not `height`, sets the 32px row:
   a block keeps `height` fixed and its content spills into the next row. */
:where(.ui-table) th {
	padding: 0 12px 6px 0;
	border-bottom: 1px solid var(--border);
	color: var(--muted-foreground);
	font-size: 12px;
	font-weight: 400;
	text-align: left;
	white-space: nowrap;
}
:where(.ui-table) td {
	padding: 6px 12px 6px 0;
	border-bottom: 1px solid var(--border);
}
:where(.ui-table tr:last-child) td {
	border-bottom: 0;
}
.ui-table .num {
	text-align: right;
	padding-right: 0;
}
.ui-table .bar {
	position: relative;
}
.ui-table .bar > span {
	position: absolute;
	left: 0;
	top: 50%;
	height: 4px;
	margin-top: -2px;
	border-radius: 2px;
	background: var(--chart-1);
	opacity: 0.35;
}

/* Wireframes */
.ui-wire {
	display: block;
	height: 6px;
	border-radius: 3px;
	background: var(--muted);
}
.ui-wire-box {
	border-radius: 8px;
	box-shadow: inset 0 0 0 1px var(--border);
}
.ui-note {
	display: inline-grid;
	place-items: center;
	width: 16px;
	height: 16px;
	flex: none;
	border-radius: 50%;
	box-shadow: inset 0 0 0 1px var(--chart-1);
	color: var(--chart-1);
	font-size: 10px;
	font-weight: 500;
	font-variant-numeric: tabular-nums;
}

/* Charts drawn by ui.line and ui.bars */
.ui-chart {
	position: relative;
	display: block;
	width: 100%;
	outline: none;
}
.ui-chart svg {
	display: block;
	width: 100%;
	overflow: visible;
	font-size: 11px;
	font-variant-numeric: tabular-nums;
}
.ui-chart text {
	fill: var(--muted-foreground);
}
.ui-chart .halo {
	paint-order: stroke;
	stroke: var(--background);
	stroke-width: 4px;
	stroke-linejoin: round;
}
.ui-chart .series-label {
	font-size: 12px;
}
.ui-key {
	display: flex;
	flex-wrap: wrap;
	gap: 4px 14px;
	margin-bottom: 10px;
	font-size: 12px;
	color: var(--muted-foreground);
}
.ui-key span {
	display: inline-flex;
	align-items: center;
	gap: 6px;
}
.ui-key i {
	width: 8px;
	height: 8px;
	border-radius: 2px;
	background: var(--c);
}
.ui-tip {
	position: fixed;
	z-index: 10;
	min-width: 120px;
	padding: 8px 10px;
	border-radius: 8px;
	background: var(--background);
	box-shadow:
		0 0 0 1px var(--border),
		0 8px 24px -8px rgb(0 0 0 / 0.2);
	font-size: 12px;
	line-height: 18px;
	font-variant-numeric: tabular-nums;
	pointer-events: none;
	opacity: 0;
	transform: translateY(2px);
	transition:
		opacity 120ms ease-out,
		transform 120ms ease-out;
}
.ui-tip.on {
	opacity: 1;
	transform: none;
}
.ui-tip .head {
	margin-bottom: 4px;
	color: var(--muted-foreground);
}
.ui-tip .item {
	display: flex;
	align-items: center;
	gap: 8px;
}
.ui-tip .item b {
	margin-left: auto;
	padding-left: 16px;
	font-weight: 500;
}
.ui-tip .item i {
	width: 8px;
	height: 2px;
	border-radius: 1px;
	background: var(--c);
}

/* Motion */
.ui-enter {
	animation: ui-enter 200ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes ui-enter {
	from {
		opacity: 0;
		transform: translateY(4px);
	}
}
@keyframes ui-spin {
	to {
		transform: rotate(360deg);
	}
}
@media (prefers-reduced-motion: reduce) {
	*,
	*::before,
	*::after {
		animation-duration: 1ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: 1ms !important;
	}
}

/* Range slider: a hairline track with the filled part in the foreground color */
.ui-range {
	--p: 50%;
	width: 100%;
	height: 20px;
	margin: 0;
	background: transparent;
	appearance: none;
	-webkit-appearance: none;
	cursor: pointer;
}
.ui-range::-webkit-slider-runnable-track {
	height: 4px;
	border-radius: 2px;
	background: linear-gradient(to right, var(--foreground) var(--p), var(--muted) var(--p));
}
.ui-range::-webkit-slider-thumb {
	-webkit-appearance: none;
	width: 14px;
	height: 14px;
	margin-top: -5px;
	border-radius: 50%;
	background: var(--foreground);
	box-shadow:
		0 0 0 3px var(--background),
		0 0 0 4px var(--border);
	transition: transform 120ms ease-out;
}
.ui-range:active::-webkit-slider-thumb {
	transform: scale(1.1);
}
.ui-range::-moz-range-track {
	height: 4px;
	border-radius: 2px;
	background: var(--muted);
}
.ui-range::-moz-range-progress {
	height: 4px;
	border-radius: 2px;
	background: var(--foreground);
}
.ui-range::-moz-range-thumb {
	width: 14px;
	height: 14px;
	border: 0;
	border-radius: 50%;
	background: var(--foreground);
	box-shadow:
		0 0 0 3px var(--background),
		0 0 0 4px var(--border);
}
.ui-range:focus-visible {
	outline: 2px solid var(--link);
	outline-offset: 4px;
	border-radius: 4px;
}

/* Dashboards, after the Amp team's /stats page */
.ui-logo {
	width: 16px;
	height: 16px;
	flex: none;
	fill: currentColor;
	stroke: none;
	vertical-align: -3px;
}
.ui-logo.sm {
	width: 14px;
	height: 14px;
}
.ui-logo.xs {
	width: 10px;
	height: 10px;
	vertical-align: -1px;
}
.ui-section {
	font-family: var(--font-mono);
	font-size: 10px;
	line-height: 14px;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: color-mix(in oklab, var(--muted-foreground) 75%, transparent);
}
.ui-legend {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: 4px 16px;
	margin-top: 12px;
	font-family: var(--font-mono);
	font-size: 10px;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: var(--muted-foreground);
}
.ui-legend span {
	display: inline-flex;
	align-items: center;
	gap: 6px;
}
.ui-legend i {
	width: 8px;
	height: 8px;
	border-radius: 1px;
	background: var(--c);
}
.ui-swatch {
	display: inline-grid;
	place-items: center;
	width: 14px;
	height: 14px;
	flex: none;
	border-radius: 2px;
	color: #071b1c;
}
.ui-tip.mono {
	font-family: var(--font-mono);
	font-size: 11px;
	line-height: 18px;
	min-width: 200px;
}
.ui-tip.mono .head {
	text-transform: uppercase;
	letter-spacing: 0.04em;
	color: color-mix(in oklab, var(--muted-foreground) 80%, transparent);
}
.ui-tip.mono .item {
	gap: 6px;
}
.ui-tip.mono .item span:not(.ui-swatch) {
	text-transform: uppercase;
	color: var(--muted-foreground);
}
.ui-tip.mono .item b {
	font-weight: 400;
	color: var(--foreground);
}
.ui-stack-chart {
	display: grid;
	grid-template-columns: 32px 1fr;
	column-gap: 8px;
}
.ui-stack-axis {
	position: relative;
	height: var(--h);
	font-family: var(--font-mono);
	font-size: 10px;
	color: var(--muted-foreground);
	text-align: right;
	font-variant-numeric: tabular-nums;
}
.ui-stack-axis span {
	position: absolute;
	right: 0;
	transform: translateY(50%);
}
.ui-stack-plot {
	position: relative;
	height: var(--h);
}
.ui-stack-plot > i {
	position: absolute;
	left: 0;
	right: 0;
	border-top: 1px dashed var(--grid);
}
.ui-stack-cols {
	position: absolute;
	inset: 0;
	display: flex;
	gap: 3px;
}
.ui-stack-col {
	position: relative;
	flex: 1;
	min-width: 0;
	display: flex;
	align-items: flex-end;
	border-radius: 4px;
}
.ui-stack-bar {
	display: flex;
	flex-direction: column-reverse;
	width: 100%;
	border-radius: 3px;
	overflow: hidden;
	transform-origin: bottom;
	transition:
		transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1) var(--d),

			const target = niceTicks(
				opts.min ?? Math.min(0, ...all),
				opts.max ?? Math.max(...all),
				w < 420 ? 3 : 4,
			)
			const t = move?.t ?? 1
			// Ticks of the new range fade in and old ones fade out while the scale slides them.
			const ticks = target.map((v) => {
				const was = move?.from.ticks.find((tick) => tick.v === v)
				return { v, o: move ? lerp(was?.o ?? 0, 1, t) : 1 }
			})
			for (const tick of move?.from.ticks ?? [])
				if (!target.includes(tick.v)) ticks.push({ v: tick.v, o: tick.o * (1 - t) })
			const right =
				opts.labels === false ? 4 : Math.max(...opts.series.map((s) => measureText(s.name))) + 14
			const top = 10
			const bottom = 22
			const n = opts.x.length
			const x = (i) => (i * (w - right)) / (n - 1)
			// The y scale is y(v) = base + slope·v. While an update moves, base and slope ease from the
			// old scale to the new one and every point eases in pixels from where it was drawn to where
			// it lands, so each point and gridline moves along one eased path.
			const slope = -(H - top - bottom) / (target.at(-1) - target[0])
			const base = H - bottom - slope * target[0]
			const scale = move
				? { base: lerp(move.from.base, base, t), slope: lerp(move.from.slope, slope, t) }
				: { base, slope }
			const y = (v) => scale.base + scale.slope * v
			const points = opts.series.map((series, k) =>
				series.values.map((v, i) => {
					const end = base + slope * v
					return move ? lerp(move.from.points[k]?.[i] ?? end, end, t) : end
				}),
			)
			svg.setAttribute('height', H)
			svg.setAttribute('viewBox', `0 0 ${w} ${H}`)
			let s = `<defs><clipPath id="r${uid}"><rect x="-4" y="-8" width="${(w - right + 8) * reveal}" height="${H + 16}"/></clipPath></defs>`
			for (const a of opts.annotations ?? []) {
				if (a.type === 'band')
					s += `<rect x="${x(a.from)}" y="${top}" width="${x(a.to) - x(a.from)}" height="${H - top - bottom}" fill="var(--foreground)" opacity="0.045"/>`
				if (a.type === 'marker')
					s += `<line x1="${x(a.at)}" x2="${x(a.at)}" y1="${top}" y2="${H - bottom}" stroke="var(--chart-context)" stroke-dasharray="2 3"/>`
			}
			// Ticks sliding past the plot's top or bottom edge fade out over 10px instead of drawing
			// over the controls above the chart or the x labels below it.
			const tickOpacity = (tick) =>
				(
					tick.o * clamp(1 - Math.max(0, top - y(tick.v), y(tick.v) - (H - bottom)) / 10, 0, 1)
				).toFixed(3)
			for (const tick of ticks)
				s += `<line x1="0" x2="${w - right}" y1="${y(tick.v)}" y2="${y(tick.v)}" stroke="${tick.v === 0 ? 'var(--border)' : 'var(--grid)'}" opacity="${tickOpacity(tick)}"/>`
			for (const a of opts.annotations ?? []) {
				if (a.type === 'rule')
					s += `<line x1="0" x2="${w - right}" y1="${y(a.y)}" y2="${y(a.y)}" stroke="var(--chart-context)" stroke-dasharray="4 3"/>`
			}
			s += `<g clip-path="url(#r${uid})">`
			opts.series.forEach((series, k) => {
				const d = points[k]
					.map((py, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${py.toFixed(1)}`)
					.join('')
				const strong = series.highlight || !opts.series.some((o) => o.highlight)
				s += `<path d="${d}" fill="none" stroke="${colors[k]}" stroke-width="${strong ? 2 : 1.5}" stroke-linejoin="round" stroke-linecap="round"/>`
			})
			s += '</g>'
			// Text after lines, with halos, so labels stay readable where lines cross them.
			for (const tick of ticks)
				s += `<text class="halo" x="0" y="${y(tick.v) - 5}" opacity="${tickOpacity(tick)}">${esc(fmt(tick.v))}${tick.v === target.at(-1) && opts.unit ? ` ${esc(opts.unit)}` : ''}</text>`
			const xTicks =
				opts.xTicks ??
				(w < 420 ? [0, n - 1] : [0, Math.round((n - 1) / 3), Math.round((2 * (n - 1)) / 3), n - 1])
			for (const i of xTicks)
				s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(opts.x[i])}</text>`
			for (const a of opts.annotations ?? []) {
				if (a.type === 'band' && a.label)
					s += `<text x="${x(a.from) + 6}" y="${top + 13}">${esc(a.label)}</text>`
				if (a.type === 'marker' && a.label)
					s += `<text class="halo" x="${x(a.at) + 5}" y="${top + 13}">${esc(a.label)}</text>`
				if (a.type === 'rule' && a.label)
					s += `<text class="halo" x="${w - right}" y="${y(a.y) - 5}" text-anchor="end">${esc(a.label)}</text>`
				if (a.type === 'point') {
					const k =
						typeof a.series === 'number'
							? a.series
							: opts.series.findIndex((o) => o.name === a.series)
					const py = points[k][a.at]
					s += `<circle cx="${x(a.at)}" cy="${py}" r="3" fill="${colors[k]}" opacity="${reveal}"/>`
					s += `<text class="halo" x="${x(a.at)}" y="${py - 9}" text-anchor="middle" style="fill:var(--foreground)" opacity="${reveal}">${esc(a.label ?? fmt(shown[k][a.at]))}</text>`
				}
			}
			// End labels sit nudged apart, in the order of the new data's last values. While an update
			// moves, each label eases from its old offset to its new one, so labels whose lines cross
			// slide past each other instead of swapping places in one frame.
			const ends = points.map((p) => p[n - 1])
			const settled = nudgeApart(
				ends,
				opts.series.map((series) => series.values[n - 1]),
			)
			const offsets = settled.map((p, k) =>
				move ? lerp(move.from.offsets[k] ?? 0, p - ends[k], t) : p - ends[k],
			)
			if (opts.labels !== false)
				opts.series.forEach((series, k) => {
					const strong = series.highlight || !opts.series.some((o) => o.highlight)
					if (strong)
						s += `<circle cx="${x(n - 1)}" cy="${ends[k]}" r="3" fill="${colors[k]}" opacity="${reveal}"/>`
					s += `<text class="series-label" x="${w - right + 8}" y="${ends[k] + offsets[k] + 4}" style="fill:${strong ? colors[k] : 'var(--muted-foreground)'}" opacity="${reveal}">${esc(series.name)}</text>`
				})
			if (hover !== null) {
				s += `<line x1="${x(hover)}" x2="${x(hover)}" y1="${top}" y2="${H - bottom}" stroke="var(--border)"/>`
				opts.series.forEach((_, k) => {
					s += `<circle cx="${x(hover)}" cy="${points[k][hover]}" r="3.5" fill="var(--background)" stroke="${colors[k]}" stroke-width="2"/>`
				})
			}
			svg.innerHTML = s
			geometry = { x, w, right, n, colors, fmt }
			drawn = { ...scale, points, ticks: ticks.filter((tick) => tick.o > 0), offsets }
		}

		let geometry = null
		const uid = Math.random().toString(36).slice(2, 8)

		function showTip(i, clientX, clientY) {
			hover = i
			draw()
			const { fmt, colors } = geometry
			const rows = opts.series
				.map((series, k) => ({ series, k, v: shown[k][i] }))
				.sort((a, b) => b.v - a.v)
				.map(
					({ series, k, v }) =>
						`<div class="item"><i style="--c:${colors[k]}"></i>${esc(series.name)}<b>${esc(fmt(v))}${opts.unit ? ` ${esc(opts.unit)}` : ''}</b></div>`,
				)
				.join('')
			tip(
				`<div class="head">${esc(opts.tooltipTitle ? opts.tooltipTitle(i) : opts.x[i])}</div>${rows}`,
				clientX,
				clientY,
			)
		}

		svg.addEventListener('pointermove', (e) => {
			if (!geometry) return
			const r = svg.getBoundingClientRect()
			const i = clamp(
				Math.round(((e.clientX - r.left) / (geometry.w - geometry.right)) * (geometry.n - 1)),
				0,
				geometry.n - 1,
			)
			if (i !== hover) showTip(i, e.clientX, e.clientY)
			else tip(tipEl.innerHTML, e.clientX, e.clientY)
		})
		svg.addEventListener('pointerleave', () => {
			hover = null
			tip(null)
			draw()
		})
		el.addEventListener('keydown', (e) => {
			if (!['ArrowLeft', 'ArrowRight', 'Escape'].includes(e.key) || !geometry) return
			e.preventDefault()
			if (e.key === 'Escape') {
				hover = null
				tip(null)
				return draw()
			}
			const i = clamp(
				(hover ?? geometry.n - 1) + (e.key === 'ArrowRight' ? 1 : -1),
				0,
				geometry.n - 1,
			)
			const r = svg.getBoundingClientRect()
			showTip(i, r.left + geometry.x(i), r.top + 40)
		})
		el.addEventListener('blur', () => {
			hover = null
			tip(null)
			draw()
		})

		draw()
		new ResizeObserver(draw).observe(el)
		whenVisible(el, (animate) => {
			if (!animate) return
			const start = performance.now()
			const step = (now) => {
				reveal = easeOut(clamp((now - start) / 700, 0, 1))
				draw()
				if (reveal < 1) requestAnimationFrame(step)
			}
			requestAnimationFrame(step)
		})

		let frame = 0
		return {
			update(next) {
				const from = shown.map((v) => v.slice())
				opts = { ...opts, ...next }
				const to = opts.series.map((s) => s.values)
				cancelAnimationFrame(frame)
				move = drawn && { from: drawn, t: 0 }
				const start = performance.now()
				const duration = reduceMotion.matches ? 0 : 260
				const step = (now) => {
					const t = duration ? easeOut(clamp((now - start) / duration, 0, 1)) : 1
					shown = to.map((vals, k) => vals.map((v, i) => lerp(from[k]?.[i] ?? v, v, t)))
					if (move) move.t = t
					if (t === 1) move = null
					draw()
					if (t < 1) frame = requestAnimationFrame(step)
				}
				step(start)
			},
		}
	}

	/**
	 * ui.bars(el, { items: [{ label, value, highlight }] or [{ label, values: [a, b] }],
	 *   keys: ['TypeScript', 'Svelte'], format, sort = true, mono = false, share = false })
	 * Horizontal bars with labels on the left and values at the bar ends.
	 */
	function bars(el, options) {
		let opts = options
		el.classList.add('ui-chart')
		// `hidden` renders the bars at zero width and the values transparent, for the entrance.
		function render(hidden) {
			const items = opts.items.map((item) => ({
				...item,
				values: item.values ?? [item.value],
				total: item.value ?? item.values.reduce((a, b) => a + b, 0),
			}))
			// Muted rows (Other, the rest) stay last.
			if (opts.sort !== false)
				items.sort(
					(a, b) => Number(Boolean(a.muted)) - Number(Boolean(b.muted)) || b.total - a.total,
				)
			const max = opts.max ?? Math.max(...items.map((i) => i.total))
			const sum = items.reduce((a, i) => a + i.total, 0)
			const fmt = opts.format ?? ((v) => format(v, { compact: true }))
			const highlighted = items.some((i) => i.highlight)
			const segColor = (k) => `var(--chart-${k + 1})`
			let html = ''
			if (opts.keys)
				html += `<div class="ui-key">${opts.keys.map((key, k) => `<span><i style="--c:${segColor(k)}"></i>${esc(key)}</span>`).join('')}</div>`
			html += `<div style="display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:6px;align-items:center">`
			items.forEach((item, row) => {
				const color =
					item.color ??
					(item.muted
						? 'var(--chart-context)'
						: opts.keys
							? null
							: highlighted && !item.highlight
								? 'var(--chart-context)'
								: 'var(--chart-1)')
				const pct = (item.total / max) * 100
				const segs = item.values
					.map((v, k) =>
						v > 0 ? `<span style="flex:${v};background:${color ?? segColor(k)}"></span>` : '',
					)
					.join('')
				const value = `${fmt(item.total)}${opts.share ? `<span class="ui-muted"> ${format(item.total / sum, { percent: true })}</span>` : ''}`
				html += `<div class="${opts.mono ? 'ui-mono' : ''}" style="color:${item.muted ? 'var(--muted-foreground)' : 'inherit'};white-space:nowrap">${esc(item.label)}</div>`
				html += `<div data-row="${row}" style="position:relative;height:20px;display:flex;align-items:center"><div class="bar" style="display:flex;gap:1px;height:16px;width:${pct}%;min-width:2px;border-radius:2px;overflow:hidden;transform-origin:left;${hidden ? `transform:scaleX(0);transition:transform 600ms cubic-bezier(.2,.8,.2,1) ${row * 35}ms` : ''}">${segs}</div><span class="ui-num" style="margin-left:8px;font-size:12px;white-space:nowrap;${hidden ? `opacity:0;transition:opacity 200ms ease-out ${300 + row * 35}ms` : ''}">${value}</span></div>`
			})
			html += '</div>'
			el.innerHTML = html
			el.querySelectorAll('[data-row]').forEach((rowEl) => {
				const item = items[Number(rowEl.dataset.row)]
				rowEl.addEventListener('pointermove', (e) => {
					const parts = opts.keys
						? item.values
								.map(
									(v, k) =>
										`<div class="item"><i style="--c:${segColor(k)}"></i>${esc(opts.keys[k])}<b>${esc(fmt(v))}</b></div>`,
								)
								.join('')
						: ''
					tip(
						`<div class="head">${esc(item.label)}</div>${parts}<div class="item">Total<b>${esc(fmt(item.total))}</b></div>`,
						e.clientX,
						e.clientY,
					)
				})
				rowEl.addEventListener('pointerleave', () => tip(null))
			})
		}
		render(entranceMotion())
		whenVisible(el, (animate) => {
			if (!animate) return
			requestAnimationFrame(() => {
				el.querySelectorAll('.bar').forEach((b) => {
					b.style.transform = 'none'
				})
				el.querySelectorAll('[data-row] > .ui-num').forEach((v) => {
					v.style.opacity = '1'
				})
			})
		})
		return {
			update(next) {
				opts = { ...opts, ...next }
				render(false)
			},
		}
	}

	/**
	 * ui.stack(el, { x: ['Jul 4', …], series: [{ name, values, icon }], percent = true, height = 200,
	 *   legend = true, format }) draws Amp's composition columns (as on /stats): one
	 * stacked column per x value, the first series at the bottom, a hover panel with every part.
	 */
	function stack(el, options) {
		const opts = { percent: true, height: 200, legend: true, ...options }
		el.classList.add('ui-chart')
		const color = (k) => opts.series[k].color ?? `var(--series-${(k % 10) + 1})`
		const n = opts.x.length
		const totals = opts.x.map((_, i) => opts.series.reduce((sum, s) => sum + (s.values[i] ?? 0), 0))
		const max = opts.percent ? 100 : Math.max(...totals)
		const share = (k, i) =>
			opts.percent
				? ((opts.series[k].values[i] ?? 0) / (totals[i] || 1)) * 100
				: (opts.series[k].values[i] ?? 0)
		const fmt =
			opts.format ??
			((v) =>
				opts.percent ? `${v.toFixed(1).replace(/\.0$/, '')}%` : format(v, { compact: true }))
		const ticks = opts.percent ? [0, 25, 50, 75, 100] : niceTicks(0, max, 4)
		const top = ticks.at(-1)
		const every = Math.ceil(n / (el.getBoundingClientRect().width < 420 ? 5 : 10))
		let html = `<div class="ui-stack-chart" style="--h:${opts.height}px">`
		html += `<div class="ui-stack-axis">${ticks.map((t) => `<span style="bottom:${(t / top) * 100}%">${opts.percent ? `${t}%` : esc(format(t, { compact: true }))}</span>`).join('')}</div>`
		html += `<div class="ui-stack-plot">${ticks.map((t) => `<i style="bottom:${(t / top) * 100}%"></i>`).join('')}<div class="ui-stack-cols">`
		opts.x.forEach((label, i) => {
			const total = opts.percent ? 100 : totals[i]
			html += `<div class="ui-stack-col" data-i="${i}"><div class="ui-stack-bar" style="height:${(total / top) * 100}%;--d:${i * 22}ms">`
			opts.series.forEach((_, k) => {
				const v = share(k, i)
				if (v > 0) html += `<span style="flex:${v};background:${color(k)}"></span>`
			})
			html += '</div></div>'
		})
		html += '</div></div><div></div><div class="ui-stack-x">'
		opts.x.forEach((label, i) => {
			// Every nth date, plus the last one, never two labels side by side.
			const shown = i === n - 1 || (i % every === 0 && n - 1 - i >= every)
			html += `<span>${shown ? esc(label) : ''}</span>`
		})
		html += '</div></div>'
		if (opts.legend)
			html += `<div class="ui-legend">${opts.series.map((s, k) => `<span><i style="--c:${color(k)}"></i>${esc(s.name)}</span>`).join('')}</div>`
		el.innerHTML = html
		if (entranceMotion()) el.classList.add('growing')
		const swatch = (k) => {
			const s = opts.series[k]
			return `<span class="ui-swatch" style="background:${color(k)}">${s.icon ? icon(s.icon, 'xs') : ''}</span>`
		}
		el.querySelectorAll('.ui-stack-col').forEach((col) => {
			const i = Number(col.dataset.i)
			col.addEventListener('pointerenter', (e) => {
				el.classList.add('hovering')
				col.classList.add('on')
				const rows = opts.series
					.map((s, k) => ({ s, k, v: share(k, i) }))
					.filter((r) => r.v > 0)
					.sort((a, b) => b.v - a.v)
					.map(
						({ s, k, v }) =>
							`<div class="item">${swatch(k)}<span>${esc(s.name)}</span><b>${esc(fmt(v))}</b></div>`,
					)
					.join('')
				tip(
					`<div class="head">${esc(opts.tooltipTitle ? opts.tooltipTitle(i) : opts.x[i])}</div>${rows}`,
					e.clientX,
					e.clientY,
					'mono',
				)
			})
			col.addEventListener('pointermove', (e) => tip(tipEl.innerHTML, e.clientX, e.clientY, 'mono'))
			col.addEventListener('pointerleave', () => {
				el.classList.remove('hovering')
				col.classList.remove('on')
				tip(null)
			})
		})
		whenVisible(el, (animate) => {
			if (animate) requestAnimationFrame(() => el.classList.remove('growing'))
		})
	}

	/**
	 * ui.leaderboard(el, { items: [{ name, sub, value, delta, icon, color }], format, deltaUnit = 'pts' })
	 * Amp's ranked cards: a colored block with the rank and a logo, the name and maker, the value,
	 * and the change. Items keep their order; colors follow --series-* unless given.
	 */
	function leaderboard(el, options) {
		const fmt = options.format ?? ((v) => `${format(v, { digits: v < 10 ? 1 : 0 })}%`)
		const unit = options.deltaUnit ?? 'pts'
		el.classList.add('ui-leaderboard')
		el.style.setProperty('--rows', Math.ceil(options.items.length / 2))
		el.innerHTML = options.items
			.map((item, k) => {
				const delta =
					item.delta === undefined || item.delta === null
						? '<span class="ui-caption">new</span>'
						: `<span class="ui-delta" data-tone="${item.delta >= 0 ? 'success' : 'danger'}">${icon(item.delta >= 0 ? 'arrow-up' : 'arrow-down', 'xs')}${format(Math.abs(item.delta), { digits: 1 })} ${esc(unit)}</span>`
				return `<div class="ui-leader"><span class="ui-leader-mark" style="background:${item.color ?? `var(--series-${(k % 10) + 1})`}"><span class="rank">${k + 1}</span>${item.icon ? icon(item.icon) : ''}</span><span class="ui-leader-body"><span class="name">${esc(item.name)}</span><span class="value ui-num">${esc(fmt(item.value))}</span><span class="sub">${esc(item.sub ?? '')}</span>${delta}</span></div>`
			})
			.join('')
	}

	// ui.sparkline(el, values, { color }) draws a small trend that fits a line of text.
	function sparkline(el, values, options = {}) {
		const w = options.width ?? 64
		const h = options.height ?? 18
		const lo = Math.min(...values)
		const hi = Math.max(...values)
		const x = (i) => 1 + (i * (w - 4)) / (values.length - 1)
		const y = (v) => 2 + (1 - (v - lo) / (hi - lo || 1)) * (h - 4)
		const color = options.color ?? 'var(--chart-1)'
		el.innerHTML = `<svg width="${w}" height="${h}" style="vertical-align:-4px;overflow:visible"><path d="${values.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join('')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(values.length - 1)}" cy="${y(values.at(-1))}" r="2" fill="${color}"/></svg>`
	}

	// Segmented controls (.ui-seg) get a sliding thumb and emit 'change' with detail.value.
	function upgradeSeg(seg) {
		if (seg.dataset.ui) return
		seg.dataset.ui = '1'
		seg.setAttribute('role', 'tablist')
		const thumb = document.createElement('span')
		thumb.className = 'ui-seg-thumb'
		seg.prepend(thumb)
		const place = (animate) => {
			const selected =
				seg.querySelector('button[aria-selected="true"]') ?? seg.querySelector('button')
			if (!selected) return
			if (!animate) thumb.style.transition = 'none'
			thumb.style.width = `${selected.offsetWidth}px`
			thumb.style.transform = `translateX(${selected.offsetLeft}px)`
			if (!animate)
				requestAnimationFrame(() => {
					thumb.style.transition = ''
				})
		}
		seg.querySelectorAll('button').forEach((b) => {
			b.setAttribute('role', 'tab')
			if (!b.hasAttribute('aria-selected')) b.setAttribute('aria-selected', 'false')
		})
		seg.addEventListener('click', (e) => {
			const button = e.target.closest('button')
			if (!button || button.getAttribute('aria-selected') === 'true') return
			seg
				.querySelectorAll('button')
				.forEach((b) => b.setAttribute('aria-selected', String(b === button)))
			place(true)
			seg.dispatchEvent(
				new CustomEvent('change', {
					detail: { value: button.dataset.value ?? button.textContent.trim() },
				}),
			)
		})
		new ResizeObserver(() => place(false)).observe(seg)
		place(false)
	}

	// Range sliders (.ui-range) fill their track up to the thumb.
	function upgradeRange(input) {
		if (input.dataset.ui) return
		input.dataset.ui = '1'
		const fill = () =>
			input.style.setProperty(
				'--p',
				`${((input.value - input.min) / (input.max - input.min || 1)) * 100}%`,
			)
		input.addEventListener('input', fill)
		fill()
	}

	function upgrade(root) {
		root.querySelectorAll?.('i[data-icon]').forEach((i) => {
			const style = i.getAttribute('style')
			i.outerHTML = icon(i.dataset.icon, i.className).replace(
				'<svg ',
				`<svg ${style ? `style="${esc(style)}" ` : ''}`,
			)
		})
		root.querySelectorAll?.('.ui-seg').forEach(upgradeSeg)
		root.querySelectorAll?.('.ui-range').forEach(upgradeRange)
	}

	function start() {
		document.body.insertAdjacentHTML(
			'afterbegin',
			`<svg width="0" height="0" style="position:absolute" aria-hidden="true">${ICONS}</svg>`,
		)
		upgrade(document)
		new MutationObserver((records) => {
			for (const r of records)
				for (const node of r.addedNodes)
					if (node.nodeType === 1) {
						if (node.matches('i[data-icon], .ui-seg, .ui-range'))
							upgrade(node.parentElement ?? document)
						else upgrade(node)
					}
		}).observe(document.body, { childList: true, subtree: true })
	}

	// ui.download(name, content, type) saves a string, Blob, ArrayBuffer, or typed array as a file.
	// In a view, the host's bootstrap turns the download link into a save the reader confirms.
	function download(name, content, type) {
		const blob =
			content instanceof Blob
				? content
				: new Blob([content], {
						type: type ?? (typeof content === 'string' ? 'text/plain' : 'application/octet-stream'),
					})
		const link = document.createElement('a')
		link.href = URL.createObjectURL(blob)
		link.download = name
		link.click()
		URL.revokeObjectURL(link.href)
	}

	// ui.amp.call(name, args) calls a host tool through the view bootstrap's window.amp. Snapshots,
	// prints, and exported pages have no host, so `ui.amp.available` is false there and calls reject.
	const amp = {
		get available() {
			return typeof window.amp?.callTool === 'function'
		},
		call(name, args) {
			return amp.available
				? window.amp.callTool(name, args)
				: Promise.reject(new Error('Open this in Amp to apply'))
		},
	}

	const sameValue = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null)
	const clip = (text, max = 48) => (text.length > max ? `${text.slice(0, max - 1)}…` : text)
	function readable(value) {
		if (value === undefined || value === null || value === '') return 'Not set'
		if (typeof value === 'boolean') return value ? 'On' : 'Off'
		if (typeof value === 'number') return format(value, { digits: Number.isInteger(value) ? 0 : 2 })
		if (Array.isArray(value)) return value.length ? clip(value.map(readable).join(', ')) : 'None'
		if (typeof value === 'object') return clip(JSON.stringify(value))
		return clip(String(value).replace(/\s+/g, ' ').trim())
	}
	const usd = (v) => format(v, { prefix: '$', digits: Math.abs(v) < 100 ? 2 : 0 })
	const SCOPE_ICONS = { personal: 'user', workspace: 'users', project: 'folder' }
	const SCOPE_LABELS = { workspace: 'Workspace', project: 'Project' }
	/** Appearance settings stored only on this device, which the host reads and applies itself. */
	const DEVICE_SETTING_KEYS = new Set([
		'personal.theme',
		'personal.text-size',
		'personal.message-timestamps',
	])
	/**
	 * ui.settingsCard(el, spec) renders a settings change Puck proposes, which the reader adjusts,
	 * applies, and undoes. Keys are manage_amp setting keys (`color_theme`), read and changed
	 * through the host's manage_amp tool with manage_amp's own dialogs, or the device keys in
	 * DEVICE_SETTING_KEYS, read and applied through amp_device_settings.
	 *
	 * spec = {
	 *   title, icon?,                  // icon: a kit sprite name, such as 'settings'; an unknown
	 *                                  // name shows 'settings'
	 *   scope?: { kind: 'personal' | 'workspace' | 'project', label },  // the chip; none for personal
	 *   changes: [{
	 *     key, label?, value,          // value: the proposed value
	 *     display?,                    // a string for the proposed value, or (value) => string
	 *     before?,                     // the current value to show until the host answers
	 *                                  // and in snapshots and exports, which have no host
	 *     choices?: [{ value, label }], // pill buttons; picking one sets the change's value
	 *   }],
	 *   notes?: [{ text, icon?, tone?: 'warning' | 'success' }] | ((state) => notes),
	 *   preview?: (el, state) => void, // a slot above the rows, kept between renders, re-run on
	 *                                  // every change
	 *   spend?: { workspaceID?, days = 7, project: (spend, state) => number, label? },
	 *                                  // amp_workspace_spend for the last `days` days next to
	 *                                  // project()'s total for the same period, and the difference
	 *   live?: boolean,                // apply each choice at once; Undo restores the values from
	 *                                  // when the card opened. Defaults to true when every change
	 *                                  // has choices or is a boolean; false waits for Apply
	 *   applyLabel = 'Apply',
	 * }
	 *
	 * `state`, passed to notes, preview, and project, is { phase, values, before }: phase is
	 * 'loading', 'proposed', 'applied', or 'dismissed', and values and before map each key to its
	 * proposed and current value. Without window.amp (snapshots, prints, exports) the card renders
	 * the proposal with disabled buttons. Returns { state, render }.
	 */
	function settingsCard(el, spec) {
		const pickable = (c) => c.choices?.length > 0 || typeof c.value === 'boolean'
		const live = spec.live ?? ((spec.changes ?? []).length > 0 && spec.changes.every(pickable))
		// A live card applies on pick, so a boolean change without choices gets Off and On.
		const changes = (spec.changes ?? []).map((c) =>
			live && !c.choices?.length && typeof c.value === 'boolean'
				? {
						...c,
						choices: [
							{ value: false, label: 'Off' },
							{ value: true, label: 'On' },
						],
					}
				: c,
		)
		const online = amp.available
		const S = {
			phase: online ? 'loading' : 'proposed',
			values: Object.fromEntries(changes.map((c) => [c.key, c.value])),
			before: Object.fromEntries(changes.map((c) => [c.key, c.before])),
			/** The values when the card opened, which live Undo restores. */
			opened: null,
			/** The host's current settings by key: { key, value, editable, reason }. */
			settings: {},
			/** The results of the last apply, which Undo reverts. */
			results: [],
			busy: false,
			error: null,
			notice: null,
			spend: null,
			spendError: null,
		}
		const view = () => ({ phase: S.phase, values: { ...S.values }, before: { ...S.before } })
		const previewEl = spec.preview ? document.createElement('div') : null
		if (previewEl) previewEl.className = 'ui-sc-preview'
		el.classList.add('ui-settings-card')

		const labelOf = (change, value) => {
			if (typeof change.display === 'function') return String(change.display(value))
			if (typeof change.display === 'string' && sameValue(value, change.value))
				return change.display
			const choice = change.choices?.find((c) => sameValue(c.value, value))
			return choice ? String(choice.label) : readable(value)
		}
		const pending = () =>
			changes.filter((c) => S.phase !== 'loading' && !sameValue(S.values[c.key], S.before[c.key]))
		const blocked = () =>
			Object.values(S.settings).find((setting) => setting && setting.editable === false)
		const keyOf = (item) => item.key
		const scopeKind = () => spec.scope?.kind ?? 'personal'

		function row(label, from, to) {
			const k = `<span class="ui-sc-k">${esc(label)}</span>`
			if (from === null)
				return `${k}<span class="ui-sc-v"><span class="ui-sc-after">${esc(to)}</span></span>`
			if (to === undefined || from === to)
				return `${k}<span class="ui-sc-v ui-sc-same">${esc(from)}</span>`
			return `${k}<span class="ui-sc-v"><span class="ui-sc-before">${esc(from)}</span><span class="ui-sc-arrow" aria-label="changes to">→</span><span class="ui-sc-after">${esc(to)}</span></span>`
		}

		function rowsHTML() {
			return changes
				.map((c) => {
					const label = c.label ?? S.settings[c.key]?.title ?? c.key
					if (S.phase === 'loading' && c.before === undefined)
						return row(label, '…', labelOf(c, S.values[c.key]))
					// From the value when the card opened, so an applied change still reads before → after.
					const from = S.opened ? S.opened[c.key] : S.before[c.key]
					// Without the host or a `before`, the current value is unknown, so only the proposal shows.
					const known = from !== undefined || c.key in S.settings
					return row(label, known ? labelOf(c, from) : null, labelOf(c, S.values[c.key]))
				})
				.join('')
		}

		function choicesHTML() {
			const disabled = !online || S.busy || S.phase === 'loading' || Boolean(blocked())
			return changes
				.map((c, i) => {
					if (!c.choices?.length) return ''
					const selected = S.values[c.key]
					const buttons = c.choices
						.map((choice, j) => {
							const suggested = live && sameValue(choice.value, c.value)
							return `<button type="button" class="ui-sc-opt" data-sc-change="${i}" data-sc-choice="${j}" aria-pressed="${sameValue(choice.value, selected)}"${disabled ? ' disabled' : ''}>${esc(choice.label)}${suggested ? '<span class="ui-sc-suggested" title="Suggested"></span>' : ''}</button>`
						})
						.join('')
					return `<div class="ui-sc-sec"><div class="ui-sc-lbl">${esc(c.label ?? c.key)}</div><div class="ui-sc-opts" role="group" aria-label="${esc(c.label ?? c.key)}">${buttons}</div></div>`
				})
				.join('')
		}

		function notesHTML() {
			let notes = typeof spec.notes === 'function' ? spec.notes(view()) : spec.notes
			notes = (notes ?? []).filter(Boolean)
			if (!notes.length) return ''
			const items = notes
				.map((note) => {
					const n = typeof note === 'string' ? { text: note } : note
					const name =
						n.icon ??
						(n.tone === 'warning' ? 'circle-alert' : n.tone === 'success' ? 'check' : 'info')
					return `<li${n.tone ? ` data-tone="${esc(n.tone)}"` : ''}>${icon(name, 'xs')}<span>${esc(n.text)}</span></li>`
				})
				.join('')
			return `<div class="ui-sc-sec"><div class="ui-sc-lbl">What this means</div><ul class="ui-sc-notes">${items}</ul></div>`
		}

		function spendHTML() {
			if (!spec.spend || !online) return ''
			const days = spec.spend.days ?? 7
			const label = `<div class="ui-sc-lbl">Spend, last ${days} days${S.spend?.workspaceName ? ` in ${esc(S.spend.workspaceName)}` : ''}</div>`
			if (S.spendError)
				return `<div class="ui-sc-sec">${label}<p class="ui-caption">Spend is unavailable: ${esc(S.spendError)}</p></div>`
			if (!S.spend)
				return `<div class="ui-sc-sec">${label}<p class="ui-caption">Loading spend…</p></div>`
			const total = Number(S.spend.totalUSD) || 0
			const daily = Array.isArray(S.spend.daily) ? S.spend.daily : []
			const max = Math.max(0, ...daily.map((d) => Number(d.usd) || 0))
			const bars = daily
				.map((d) => {
					const v = Number(d.usd) || 0
					return `<span title="${esc(`${d.date}: ${usd(v)}`)}" style="height:${max ? Math.max(2, (v / max) * 100) : 2}%"></span>`
				})
				.join('')
			let projected = null
			try {
				const value = spec.spend.project?.(S.spend, view())
				if (Number.isFinite(value)) projected = value
			} catch {}
			let right = ''
			if (projected !== null) {
				const diff = projected - total
				const pct = total
					? ` (${diff < 0 ? '−' : '+'}${format(Math.abs(diff / total), { percent: true })})`
					: ''
				const delta =
					Math.abs(diff) < 0.005
						? '<span class="ui-caption">No difference</span>'
						: `<span class="ui-delta" data-tone="${diff < 0 ? 'success' : 'warning'}">${diff < 0 ? '−' : '+'}${esc(usd(Math.abs(diff)))}${pct}</span>`
				right = `<div class="ui-sc-fig"><span class="ui-sc-k">${esc(spec.spend.label ?? 'With this change')}</span><span class="ui-sc-num">${esc(usd(projected))}</span>${delta}</div>`
			}
			return `<div class="ui-sc-sec">${label}<div class="ui-sc-spend"><div class="ui-sc-fig"><span class="ui-sc-k">Actual</span><span class="ui-sc-num">${esc(usd(total))}</span>${bars ? `<span class="ui-sc-bars" aria-hidden="true">${bars}</span>` : ''}</div>${right}</div></div>`
		}

		function footHTML() {
			const lock = blocked()
			const spin = S.busy ? icon('loader-circle', 'ui-spin') : ''
			let caption = ''
			if (!online) caption = 'Open this in Amp to apply'
			else if (lock) caption = lock.reason ?? 'You cannot change this setting'
			else if (S.phase === 'loading') caption = 'Checking current settings…'
			else if (S.busy) caption = 'Applying…'
			else if (S.notice) caption = S.notice
			else if (!live && S.phase === 'proposed' && !pending().length)
				caption = 'Already set. Nothing would change.'
			else if (live && S.phase === 'proposed') caption = 'Changes apply as you pick them.'
			const captionHTML = caption
				? `<span class="ui-caption"${lock ? ' data-tone="warning"' : ''}>${esc(caption)}</span>`
				: ''
			const off = !online || S.busy
			if (S.phase === 'applied')
				return `<div class="ui-sc-foot"><button type="button" class="ui-btn outline sm" data-sc-act="undo"${off ? ' disabled' : ''}>${S.busy ? spin : ''}Undo</button>${captionHTML}</div>`
			const apply = live
				? ''
				: `<button type="button" class="ui-btn primary sm" data-sc-act="apply"${off || lock || S.phase === 'loading' || !pending().length ? ' disabled' : ''}>${spin}${esc(spec.applyLabel ?? 'Apply')}</button>`
			return `<div class="ui-sc-foot">${apply}<button type="button" class="ui-btn outline sm" data-sc-act="dismiss"${off ? ' disabled' : ''}>Not Now</button>${captionHTML}</div>`
		}

		// The control to focus once it is enabled again, when a render disabled the focused one.
		let lostFocus = null
		function render() {
			const active = el.contains(document.activeElement) ? document.activeElement : null
			const focusKey = active?.dataset.scAct
				? `[data-sc-act="${active.dataset.scAct}"]`
				: active?.dataset.scChange
					? `[data-sc-change="${active.dataset.scChange}"][data-sc-choice="${active.dataset.scChoice}"]`
					: active
						? null
						: lostFocus
			if (S.phase === 'dismissed') {
				el.innerHTML = `<div class="ui-sc-dismissed">${icon('circle-x', 'xs')}<span>${esc(spec.title)}: nothing changed.</span><button type="button" class="ui-btn sm" data-sc-act="reopen">Show</button></div>`
			} else {
				const kind = scopeKind()
				// Applied sits in the header row so applying never moves the controls below it.
				const status =
					S.phase === 'applied'
						? `<span class="ui-status" data-tone="success"><span class="ui-dot"></span>Applied</span>`
						: ''
				const headIcon =
					spec.icon && document.getElementById(`i-${spec.icon}`) ? spec.icon : 'settings'
				const head = `<div class="ui-sc-head">${icon(headIcon, 'sm')}<span class="ui-sc-title">${esc(spec.title)}</span>${status}${kind === 'personal' ? '' : `<span class="ui-chip">${icon(SCOPE_ICONS[kind] ?? 'user', 'xs')}${esc(spec.scope?.label ?? SCOPE_LABELS[kind] ?? kind)}</span>`}</div>`
				const error = S.error
					? `<p class="ui-sc-error" role="alert">${icon('circle-alert', 'xs')}<span>${esc(S.error)}</span></p>`
					: ''
				el.innerHTML = `${head}${previewEl ? '<div data-sc-preview></div>' : ''}<div class="ui-sc-sec"><div class="ui-sc-rows">${rowsHTML()}</div></div>${choicesHTML()}${notesHTML()}${spendHTML()}${error}${footHTML()}`
				if (previewEl) {
					el.querySelector('[data-sc-preview]').replaceWith(previewEl)
					spec.preview(previewEl, view())
				}
			}
			const idle = !document.activeElement || document.activeElement === document.body
			if (!active && !(lostFocus && idle)) {
				lostFocus = null
				return
			}
			const target =
				(focusKey && el.querySelector(`${focusKey}:not(:disabled)`)) ??
				el.querySelector('[data-sc-act]:not(:disabled)')
			target?.focus()
			lostFocus = target ? null : (focusKey ?? '[data-sc-act]')
		}

		/** Changes one setting; resolves { key, ok, previous, next, error } or { key, cancelled }. */
		async function applyOne(c) {
			const previous = S.before[c.key]
			try {
				if (DEVICE_SETTING_KEYS.has(c.key)) {
					const result = await amp.call('amp_device_settings', {
						operation: 'set',
						key: c.key,
						value: c.value,
					})
					return { key: c.key, ok: true, previous, next: result?.next ?? c.value, error: null }
				}
				const text = await amp.call('manage_amp', {
					topic: 'settings',
					operation: 'update',
					parameters: { key: c.key, value: c.value },
				})
				// manage_amp reports a declined dialog as a result that starts with "Cancelled."
				if (typeof text === 'string' && text.startsWith('Cancelled.'))
					return { key: c.key, cancelled: true }
				return { key: c.key, ok: true, previous, next: c.value, error: null }
			} catch (error) {
				return {
					key: c.key,
					ok: false,
					previous,
					next: previous,
					error: error?.message ?? String(error),
				}
			}
		}

		async function apply(list) {
			// All at once, so every call starts within the click's user activation.
			const outcomes = await Promise.all(list.map(applyOne))
			const results = outcomes.filter((r) => !r.cancelled)
			for (const r of results) if (r.ok) S.before[keyOf(r)] = r.next
			const failed = results.filter((r) => !r.ok)
			const applied = results.some((r) => r.ok)
			if (!applied && outcomes.some((r) => r.cancelled)) return { cancelled: true, results }
			if (failed.length)
				S.error =
					failed
						.map((r) => r.error)
						.filter(Boolean)
						.join(' ') || 'The change was not applied.'
			return { applied, results }
		}

		async function run(task) {
			if (S.busy) return
			S.busy = true
			S.error = null
			S.notice = null
			render()
			try {
				await task()
			} catch (error) {
				S.error = error?.message ?? String(error)
			}
			S.busy = false
			render()
		}

		const withIDs = (c, value) => ({
			key: c.key,
			value,
			workspaceID: c.workspaceID,
			projectID: c.projectID,
		})

		el.addEventListener('click', (event) => {
			const button = event.target.closest('button')
			if (!button || !el.contains(button) || button.disabled) return
			const act = button.dataset.scAct
			if (button.dataset.scChange !== undefined) {
				const change = changes[Number(button.dataset.scChange)]
				const value = change.choices[Number(button.dataset.scChoice)].value
				S.values[change.key] = value
				if (!live) {
					// A new pick after Apply is a new proposal, applied with Apply again.
					if (S.phase === 'applied') {
						S.phase = 'proposed'
						S.results = []
					}
					return render()
				}
				if (sameValue(value, S.before[change.key])) return render()
				run(async () => {
					try {
						const { applied, cancelled } = await apply([withIDs(change, value)])
						if (applied)
							S.phase = changes.some((c) => !sameValue(S.before[c.key], S.opened[c.key]))
								? 'applied'
								: 'proposed'
						if (cancelled) S.notice = 'Cancelled. Nothing changed.'
					} finally {
						// The pressed choice follows what is applied, also when the apply failed.
						S.values[change.key] = S.before[change.key]
					}
				})
			} else if (act === 'apply') {
				run(async () => {
					const { applied, cancelled, results } = await apply(
						pending().map((c) => withIDs(c, S.values[c.key])),
					)
					if (applied) {
						S.results = results
						S.phase = 'applied'
					}
					if (cancelled) S.notice = 'Cancelled. Nothing changed.'
				})
			} else if (act === 'undo') {
				run(async () => {
					const list = live
						? changes
								.filter((c) => !sameValue(S.before[c.key], S.opened[c.key]))
								.map((c) => withIDs(c, S.opened[c.key]))
						: S.results
								.filter((r) => r.ok)
								.map((r) =>
									withIDs(changes.find((c) => c.key === keyOf(r)) ?? { key: r.key }, r.previous),
								)
					const { applied, cancelled } = await apply(list)
					if (applied) {
						S.phase = 'proposed'
						S.results = []
						if (live) S.values = { ...S.before }
					}
					if (cancelled) S.notice = 'Cancelled. The change stays applied.'
				})
			} else if (act === 'dismiss') {
				S.phase = 'dismissed'
				render()
			} else if (act === 'reopen') {
				S.phase = 'proposed'
				render()
			}
		})

		render()
		if (online) {
			const deviceKeys = changes.filter((c) => DEVICE_SETTING_KEYS.has(c.key)).map((c) => c.key)
			const serverKeys = changes.filter((c) => !DEVICE_SETTING_KEYS.has(c.key)).map((c) => c.key)
			Promise.all([
				deviceKeys.length
					? amp
							.call('amp_device_settings', { operation: 'get', keys: deviceKeys })
							.then((result) => (Array.isArray(result?.settings) ? result.settings : []))
					: [],
				serverKeys.length
					? amp
							.call('manage_amp', {
								topic: 'settings',
								operation: 'get',
								parameters: { keys: serverKeys },
							})
							.then((result) => (Array.isArray(result) ? result : []))
					: [],
			])
				.then(([device, server]) => {
					for (const setting of device) S.settings[setting.key] = { ...setting, reason: null }
					for (const view of server)
						S.settings[view.key] = {
							key: view.key,
							value: view.value,
							editable: view.editable !== false,
							reason: view.editableReason ?? null,
						}
					for (const key of [...deviceKeys, ...serverKeys]) {
						S.settings[key] ??= { key, editable: false, reason: `${key} cannot change here` }
						if ('value' in S.settings[key]) S.before[key] = S.settings[key].value
					}
				})
				.catch((error) => {
					S.error = `Could not read the current settings: ${error?.message ?? error}`
					S.settings.__error = { editable: false, reason: 'Current settings are unavailable' }
				})
				.finally(() => {
					S.opened = { ...S.before }
					// A live card shows what is applied; the proposed values are marked as suggested.
